services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mockup
      POSTGRES_PASSWORD: mockup
      POSTGRES_DB: mockup_studio
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mockup-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mockup -d mockup_studio"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  mockup-data:
